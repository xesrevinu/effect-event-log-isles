name: Restore styles.css

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/restore-styles.yml"
      - "scripts/restore-styles.py"

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and patch styles.css
        run: python3 scripts/restore-styles.py

      - name: Commit restored styles
        run: |
          set -euo pipefail
          git config user.name "Grok"
          git config user.email "grok@x.ai"
          git add src/styles.css
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "Restore styles.css and clip help-sheet horizontal overflow."
          git push
